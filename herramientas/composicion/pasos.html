<!doctype html><meta charset="utf-8"><title>pasos</title>
<!-- Los 3 pasos del README (pasos.png, 1600×460). Se arma con herramientas/composicion/armar.py -->
<style>
@font-face{font-family:Mulish;src:url(../../scripts/web/fonts/mulish.woff2)}
:root{--vino:#24111A;--rosa:#F28DB0;--txt:#F7EEF2;--suave:#C9A9B8}
html,body{margin:0;width:1600px;height:460px;overflow:hidden;background:radial-gradient(900px 400px at 10% 100%,#4A2338,transparent 60%),radial-gradient(900px 400px at 80% 0%,#3E1D30,transparent 60%),var(--vino);font-family:Mulish,"Segoe UI",sans-serif;color:var(--txt)}
.fila{position:absolute;inset:70px 104px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.paso{border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.35);padding:40px}
.n{width:64px;height:64px;border-radius:50%;background:var(--rosa);color:#24111A;display:grid;place-items:center;font-weight:900;font-size:30px}
h2{margin:30px 0 0;font-size:36px;font-weight:900}
p{margin:12px 0 0;font-size:22px;line-height:1.45;color:var(--suave)}
</style>
<div class="fila">
<div class="paso"><div class="n">1</div><h2>Descarga</h2><p>Un instalador, sin permisos de administrador.</p></div>
<div class="paso"><div class="n">2</div><h2>Abre LoL</h2><p>Racha aparece sola. No hay nada que configurar.</p></div>
<div class="paso"><div class="n">3</div><h2>Juega</h2><p>Champ select, partida y después: Racha te acompaña.</p></div>
</div>
